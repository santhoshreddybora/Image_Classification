name: CD - Deploy to Azure ML Online Endpoint

on:
  workflow_run:
    workflows: ["CI - Image Classification (TensorFlow + Azure ML)"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1️ Checkout repo (required for Azure SDK to read your code)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️ Download the tested artifact from CI
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      # 3️ Unzip the package
      - name: Extract build artifact
        run: unzip -o build_output.zip -d .

      # 4️ Login to Azure using service principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5️ Set up Azure CLI
      - name: Setup Azure CLI
        uses: azure/CLI@v2
        with:
          azcliversion: latest

      # 6️ Run your endpoint deployment script
      - name: Deploy to Azure ML Online Endpoint
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}
          AZURE_BLOB_CONN_STR: ${{ secrets.AZURE_BLOB_CONN_STR }}
          APPINSIGHTS_INSTRUMENTATIONKEY: ${{ secrets.APPINSIGHTS_INSTRUMENTATIONKEY }}
        run: |
          echo " Starting deployment to Azure ML endpoint..."
          python Azure_deployment/Endpoint_Deployment.py
      # 7️ (Optional) Show deployed endpoint details
      - name: Show endpoint info
        run: |
          echo " Deployment completed successfully!"
          az ml online-endpoint list --output table
